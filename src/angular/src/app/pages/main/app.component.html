<div id="top-sidebar"
     [class.top-sidebar-open]="showSidebar"
     [class.top-sidebar-closed]="!showSidebar">

    <div class="sidebar-layout">
        <div id="logo">
            <span class="image">
                <!--suppress HtmlUnknownTarget -->
                <img src="assets/logo.png" />
            </span>
            <span class="text"><b>Seed</b>Sync</span>

            <button id="sidebar-btn-close" class="sidebar-btn" (click)="showSidebar=false">
                <span>&#10006;</span>
            </button>
        </div>

        <app-sidebar></app-sidebar>

        <footer id="sidebar-version" [attr.aria-label]="'SeedSync current version ' + version">
            <span class="version-label">CURRENT VERSION</span>
            <span class="version-value">v{{version}}</span>
        </footer>
    </div>
</div>

<!-- Used for sidebar closing -->
<div id="outside-sidebar"
     [class.outside-sidebar-show]="showSidebar"
     [class.outside-sidebar-hide]="!showSidebar"
     (click)="showSidebar=false">
</div>

<div id="top-content">
    <div id="top-header">
        <!--
            Observe the header height so other components can correctly position
            sticky elements without relying on the old ResizeSensor helper
         -->
        <div #topHeader>

            <app-header></app-header>

            <div id="title-bar">
                <button id="sidebar-btn-open" class="sidebar-btn" (click)="showSidebar=!showSidebar">
                    &#9776;
                </button>
                <span class="mobile-brand" aria-label="SeedSync">
                    <img src="assets/logo.png" aria-hidden="true" />
                    <span class="mobile-brand-wordmark"><b>Seed</b>Sync</span>
                </span>
                <span id="title">{{activeTitle}}</span>
            </div>

        </div>

    </div>

    <router-outlet></router-outlet>
</div>
