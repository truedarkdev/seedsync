<div id="file-options"
     [style.top.px]="headerHeight | async"
     [class.sticky]="(options | async)?.pinFilter">
    <div id="filter-search">
        <img src="assets/icons/search.svg" />
        <div class="input-group">
            <input class="form-control" placeholder="Filter by name..." type="search"
                   [ngModel]="(options | async)?.nameFilter"
                   (ngModelChange)="onFilterByName($event)">
        </div>
    </div>

    <div id="filter-controls">
        <div id="filter-status" class="dropdown" >
            <button class="btn btn-secondary dropdown-toggle"
                    type="button"
                    data-toggle="dropdown"
                    data-bs-toggle="dropdown"
                    aria-haspopup="true"
                    aria-expanded="false">
                <div class="title">
                    Status:
                </div>
                <div class="selection">
                    <!-- these divs only show the selected option -->
                    <div class="sel-item" id="sel-item-all"
                         *ngIf="(options | async)?.selectedStatusFilter == null">
                        <div class="icon"></div>
                        <span class="text">All</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.selectedStatusFilter == ViewFile.Status.EXTRACTED">
                        <div class="icon"><img src="assets/icons/extracted.svg" class="extracted" /></div>
                        <span class="text">Extracted</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.selectedStatusFilter == ViewFile.Status.EXTRACTING">
                        <div class="icon"><img src="assets/icons/extracting.svg" class="extracting" /></div>
                        <span class="text">Extracting</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.selectedStatusFilter == ViewFile.Status.DOWNLOADED">
                        <div class="icon"><img src="assets/icons/downloaded.svg" class="downloaded" /></div>
                        <span class="text">Downloaded</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.selectedStatusFilter == ViewFile.Status.DOWNLOADING">
                        <div class="icon"><img src="assets/icons/downloading.svg" class="downloading" /></div>
                        <span class="text">Downloading</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.selectedStatusFilter == ViewFile.Status.QUEUED">
                        <div class="icon"><img src="assets/icons/queued.svg" class="queued" /></div>
                        <span class="text">Queued</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.selectedStatusFilter == ViewFile.Status.STOPPED">
                        <div class="icon"><img src="assets/icons/stopped.svg" class="stopped" /></div>
                        <span class="text">Stopped</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.selectedStatusFilter == ViewFile.Status.MOVE_FAILED">
                        <div class="icon"><img src="assets/icons/move-failed.png" class="move-failed" /></div>
                        <span class="text">Final move failed</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.selectedStatusFilter == ViewFile.Status.MOVE_SUCCEEDED">
                        <div class="icon"><img src="assets/icons/move-succeeded.png" class="move-succeeded" /></div>
                        <span class="text">Final move succeeded</span>
                    </div>
                </div>
            </button>
            <div class="dropdown-menu" data-bs-theme="dark">
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.selectedStatusFilter == null"
                        (click)="onFilterByStatus(null)">
                    <div class="icon"></div>
                    <span class="text">All</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.selectedStatusFilter == ViewFile.Status.MOVE_FAILED"
                        [class.disabled]="isStatusDisabled(ViewFile.Status.MOVE_FAILED) ? true : null"
                        [disabled]="isStatusDisabled(ViewFile.Status.MOVE_FAILED)"
                        (click)="onFilterByStatus(ViewFile.Status.MOVE_FAILED)">
                    <div class="icon"><img src="assets/icons/move-failed.png" class="move-failed" /></div>
                    <span class="text">Final move failed</span>
                    <span class="count">{{ getStatusCount(ViewFile.Status.MOVE_FAILED) }}</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.selectedStatusFilter == ViewFile.Status.MOVE_SUCCEEDED"
                        [class.disabled]="isStatusDisabled(ViewFile.Status.MOVE_SUCCEEDED) ? true : null"
                        [disabled]="isStatusDisabled(ViewFile.Status.MOVE_SUCCEEDED)"
                        (click)="onFilterByStatus(ViewFile.Status.MOVE_SUCCEEDED)">
                    <div class="icon"><img src="assets/icons/move-succeeded.png" class="move-succeeded" /></div>
                    <span class="text">Final move succeeded</span>
                    <span class="count">{{ getStatusCount(ViewFile.Status.MOVE_SUCCEEDED) }}</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.selectedStatusFilter == ViewFile.Status.EXTRACTED"
                        [class.disabled]="isStatusDisabled(ViewFile.Status.EXTRACTED) ? true : null"
                        [disabled]="isStatusDisabled(ViewFile.Status.EXTRACTED)"
                        (click)="onFilterByStatus(ViewFile.Status.EXTRACTED)">
                    <div class="icon"><img src="assets/icons/extracted.svg" class="extracted" /></div>
                    <span class="text">Extracted</span>
                    <span class="count">{{ getStatusCount(ViewFile.Status.EXTRACTED) }}</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.selectedStatusFilter == ViewFile.Status.EXTRACTING"
                        [class.disabled]="isStatusDisabled(ViewFile.Status.EXTRACTING) ? true : null"
                        [disabled]="isStatusDisabled(ViewFile.Status.EXTRACTING)"
                        (click)="onFilterByStatus(ViewFile.Status.EXTRACTING)">
                    <div class="icon"><img src="assets/icons/extracting.svg" class="extracting" /></div>
                    <span class="text">Extracting</span>
                    <span class="count">{{ getStatusCount(ViewFile.Status.EXTRACTING) }}</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.selectedStatusFilter == ViewFile.Status.DOWNLOADED"
                        [class.disabled]="isStatusDisabled(ViewFile.Status.DOWNLOADED) ? true : null"
                        [disabled]="isStatusDisabled(ViewFile.Status.DOWNLOADED)"
                        (click)="onFilterByStatus(ViewFile.Status.DOWNLOADED)">
                    <div class="icon"><img src="assets/icons/downloaded.svg" class="downloaded" /></div>
                    <span class="text">Downloaded</span>
                    <span class="count">{{ getStatusCount(ViewFile.Status.DOWNLOADED) }}</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.selectedStatusFilter == ViewFile.Status.DOWNLOADING"
                        [class.disabled]="isStatusDisabled(ViewFile.Status.DOWNLOADING) ? true : null"
                        [disabled]="isStatusDisabled(ViewFile.Status.DOWNLOADING)"
                        (click)="onFilterByStatus(ViewFile.Status.DOWNLOADING)">
                    <div class="icon"><img src="assets/icons/downloading.svg" class="downloading" /></div>
                    <span class="text">Downloading</span>
                    <span class="count">{{ getStatusCount(ViewFile.Status.DOWNLOADING) }}</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.selectedStatusFilter == ViewFile.Status.QUEUED"
                        [class.disabled]="isStatusDisabled(ViewFile.Status.QUEUED) ? true : null"
                        [disabled]="isStatusDisabled(ViewFile.Status.QUEUED)"
                        (click)="onFilterByStatus(ViewFile.Status.QUEUED)">
                    <div class="icon"><img src="assets/icons/queued.svg" class="queued" /></div>
                    <span class="text">Queued</span>
                    <span class="count">{{ getStatusCount(ViewFile.Status.QUEUED) }}</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.selectedStatusFilter == ViewFile.Status.STOPPED"
                        [class.disabled]="isStatusDisabled(ViewFile.Status.STOPPED) ? true : null"
                        [disabled]="isStatusDisabled(ViewFile.Status.STOPPED)"
                        (click)="onFilterByStatus(ViewFile.Status.STOPPED)">
                    <div class="icon"><img src="assets/icons/stopped.svg" class="stopped" /></div>
                    <span class="text">Stopped</span>
                    <span class="count">{{ getStatusCount(ViewFile.Status.STOPPED) }}</span>
                </button>
            </div>
        </div>

        <div id="sort-status" class="dropdown" >
            <button class="btn btn-secondary dropdown-toggle"
                    type="button"
                    data-toggle="dropdown"
                    data-bs-toggle="dropdown"
                    aria-haspopup="true"
                    aria-expanded="false">
                <div class="title">
                    Sort:
                </div>
                <div class="selection">
                    <!-- these divs only show the selected option -->
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SMART_STATUS">
                        <div class="icon"><img src="assets/icons/states.svg" class="states" /></div>
                        <span class="text">Smart Status</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.STATUS">
                        <div class="icon"><img src="assets/icons/states.svg" class="states" /></div>
                        <span class="text">Status</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.STATUS_DESC">
                        <div class="icon"><img src="assets/icons/states.svg" class="states" /></div>
                        <span class="text">Status Reverse</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.NAME_ASC">
                        <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" alt="Sort ascending" /></div>
                        <span class="text">Name A&#8594;Z</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.NAME_DESC">
                        <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" alt="Sort descending" /></div>
                        <span class="text">Name Z&#8594;A</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SIZE_ASC">
                        <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" alt="Sort ascending" /></div>
                        <span class="text">Size Small&#8594;Large</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SIZE_DESC">
                        <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" alt="Sort descending" /></div>
                        <span class="text">Size Large&#8594;Small</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SPEED_ASC">
                        <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" /></div>
                        <span class="text">Speed Slow&#8594;Fast</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SPEED_DESC">
                        <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" /></div>
                        <span class="text">Speed Fast&#8594;Slow</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.ETA_ASC">
                        <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" /></div>
                        <span class="text">ETA Short&#8594;Long</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.ETA_DESC">
                        <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" /></div>
                        <span class="text">ETA Long&#8594;Short</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.DOWNLOADED_NEWEST">
                        <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" alt="Sort newest first" /></div>
                        <span class="text">Downloaded Newest</span>
                    </div>
                    <div class="sel-item"
                         *ngIf="(options | async)?.sortMethod === ViewFileOptions.SortMethod.DOWNLOADED_OLDEST">
                        <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" alt="Sort oldest first" /></div>
                        <span class="text">Downloaded Oldest</span>
                    </div>
                </div>
            </button>
            <div class="dropdown-menu dropdown-menu-end" data-bs-theme="dark">
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SMART_STATUS"
                        (click)="onSort(ViewFileOptions.SortMethod.SMART_STATUS)">
                    <div class="icon"><img src="assets/icons/states.svg" class="states" /></div>
                    <span class="text">Smart Status</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.STATUS"
                        (click)="onSort(ViewFileOptions.SortMethod.STATUS)">
                    <div class="icon"><img src="assets/icons/states.svg" class="states" /></div>
                    <span class="text">Status</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.STATUS_DESC"
                        (click)="onSort(ViewFileOptions.SortMethod.STATUS_DESC)">
                    <div class="icon"><img src="assets/icons/states.svg" class="states" /></div>
                    <span class="text">Status Reverse</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.NAME_ASC"
                        (click)="onSort(ViewFileOptions.SortMethod.NAME_ASC)">
                    <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" alt="Sort ascending" /></div>
                    <span class="text">Name A&#8594;Z</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.NAME_DESC"
                        (click)="onSort(ViewFileOptions.SortMethod.NAME_DESC)">
                    <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" alt="Sort descending" /></div>
                    <span class="text">Name Z&#8594;A</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SIZE_ASC"
                        (click)="onSort(ViewFileOptions.SortMethod.SIZE_ASC)">
                    <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" alt="Sort ascending" /></div>
                    <span class="text">Size Small&#8594;Large</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SIZE_DESC"
                        (click)="onSort(ViewFileOptions.SortMethod.SIZE_DESC)">
                    <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" alt="Sort descending" /></div>
                    <span class="text">Size Large&#8594;Small</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SPEED_ASC"
                        (click)="onSort(ViewFileOptions.SortMethod.SPEED_ASC)">
                    <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" /></div>
                    <span class="text">Speed Slow&#8594;Fast</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.SPEED_DESC"
                        (click)="onSort(ViewFileOptions.SortMethod.SPEED_DESC)">
                    <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" /></div>
                    <span class="text">Speed Fast&#8594;Slow</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.ETA_ASC"
                        (click)="onSort(ViewFileOptions.SortMethod.ETA_ASC)">
                    <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" /></div>
                    <span class="text">ETA Short&#8594;Long</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.ETA_DESC"
                        (click)="onSort(ViewFileOptions.SortMethod.ETA_DESC)">
                    <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" /></div>
                    <span class="text">ETA Long&#8594;Short</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.DOWNLOADED_NEWEST"
                        (click)="onSort(ViewFileOptions.SortMethod.DOWNLOADED_NEWEST)">
                    <div class="icon"><img src="assets/icons/sort-desc.svg" class="sort-desc" alt="Sort newest first" /></div>
                    <span class="text">Downloaded Newest</span>
                </button>
                <button type="button" class="dropdown-item"
                        [class.active]="(options | async)?.sortMethod === ViewFileOptions.SortMethod.DOWNLOADED_OLDEST"
                        (click)="onSort(ViewFileOptions.SortMethod.DOWNLOADED_OLDEST)">
                    <div class="icon"><img src="assets/icons/sort-asc.svg" class="sort-asc" alt="Sort oldest first" /></div>
                    <span class="text">Downloaded Oldest</span>
                </button>
            </div>
        </div>

        <button id="toggle-details"
                type="button"
                class="btn btn-primary"
                [class.active]="(options | async)?.showDetails"
                (click)="onToggleShowDetails()">
            <div class="title">
                Details:
            </div>
            <div class="selection">
                <!-- these divs only show the selected option -->
                <div class="sel-item" *ngIf="(options | async)?.showDetails">
                    <div class="icon"></div>
                    <span class="text">Show</span>
                </div>
                <div class="sel-item" *ngIf="!(options | async)?.showDetails">
                    <div class="icon"></div>
                    <span class="text">Hide</span>
                </div>
            </div>
        </button>

        <div id="small-buttons">
            <button id="pin-filter"
                    type="button"
                    class="btn btn-primary"
                    [class.active]="(options | async)?.pinFilter"
                    (click)="onTogglePinFilter()">
                <i class="fa fa-thumb-tack"></i>
            </button>
        </div>
    </div>
</div>
