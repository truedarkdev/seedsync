<!--suppress HtmlUnknownAttribute -->
<ng-template #optionsList let-header="header" let-options="options" let-id="id">
    <div class="card">
        <h3 class="card-header" id="heading-{{id}}">
            <button class="btn"
                    type="button"
                    data-toggle="collapse"
                    attr.data-target="#collapse-{{id}}">
                {{header}}
            </button>
        </h3>
        <div id="collapse-{{id}}" class="collapse" data-parent="#accordion">
            <div class="card-body">
                <div [class.autoqueue-core]="id === 'autoqueue'">
                    <div *ngFor="let option of options">
                        <app-option
                            [type]="option.type"
                            [label]="option.label"
                            [description]="option.description"
                            [choices]="option.choices"
                            [disabled]="!!option.disabled || isOptionDisabled(option, config | async)"
                            [value]="(config | async)?.getValue(option.valuePath[0], option.valuePath[1])"
                            (changeEvent)="onSetConfig(option.valuePath[0], option.valuePath[1], $event)">
                        </app-option>
                    </div>
                </div>
                <div *ngIf="id === 'autoqueue'" class="card-subsection autoqueue-patterns">
                    <div class="subsection-header">
                        <h4>AutoQueue Patterns</h4>
                        <p>Manage the filename patterns used when AutoQueue is set to pattern mode.</p>
                    </div>
                    <app-autoqueue-page></app-autoqueue-page>
                </div>
            </div>
        </div>
    </div>
</ng-template>


<div id="settings">
    <div id="accordion">
        <div id="left">
            <!--suppress HtmlUnknownAttribute, UnnecessaryLabelJS -->
            <ng-container
                *ngTemplateOutlet="optionsList;context:serverContext">
            </ng-container>

            <!--suppress HtmlUnknownAttribute, UnnecessaryLabelJS -->
            <ng-container
                *ngTemplateOutlet="optionsList;context:OPTIONS_CONTEXT_DISCOVERY">
            </ng-container>

            <div class="card custom-section-card">
                <h3 class="card-header" id="heading-api-access">
                    <button class="btn"
                            type="button"
                            data-toggle="collapse"
                            attr.data-target="#collapse-api-access">
                        API Access
                    </button>
                </h3>
                <div id="collapse-api-access" class="collapse" data-parent="#accordion">
                    <div class="card-body">
                        <app-api-access></app-api-access>
                    </div>
                </div>
            </div>

            <!--suppress HtmlUnknownAttribute, UnnecessaryLabelJS -->
            <ng-container
                *ngTemplateOutlet="optionsList;context:OPTIONS_CONTEXT_EXTRACT">
            </ng-container>

            <!--suppress HtmlUnknownAttribute, UnnecessaryLabelJS -->
            <ng-container
                *ngTemplateOutlet="optionsList;context:autoqueueContext">
            </ng-container>
        </div>
        <div id="right">
            <div class="card custom-section-card">
                <h3 class="card-header" id="heading-path-pairs">
                    <button class="btn"
                            type="button"
                            data-toggle="collapse"
                            attr.data-target="#collapse-path-pairs">
                        Path Pairs
                    </button>
                </h3>
                <div id="collapse-path-pairs" class="collapse" data-parent="#accordion">
                    <div class="card-body">
                        <div class="path-pairs-header">
                            <p class="custom-section-intro">
                                Configure remote and local directory pairs for downloads. Existing SeedSync single-path
                                settings migrate into this list automatically.
                            </p>
                            <button class="btn btn-primary path-pairs-add-btn"
                                    type="button"
                                    [disabled]="pathPairsComponent?.isCreating || pathPairsComponent?.isEditing"
                                    (click)="pathPairsComponent?.startCreate()">
                                Add Path Pair
                            </button>
                        </div>
                        <app-path-pairs #pathPairsComponent></app-path-pairs>
                    </div>
                </div>
            </div>

            <!--suppress HtmlUnknownAttribute, UnnecessaryLabelJS -->
            <ng-container
                *ngTemplateOutlet="optionsList;context:OPTIONS_CONTEXT_CONNECTIONS">
            </ng-container>

            <!--suppress HtmlUnknownAttribute, UnnecessaryLabelJS -->
            <ng-container
                *ngTemplateOutlet="optionsList;context:OPTIONS_CONTEXT_TRANSFER_PROTOCOL">
            </ng-container>

            <!--suppress HtmlUnknownAttribute, UnnecessaryLabelJS -->
            <ng-container
                *ngTemplateOutlet="optionsList;context:OPTIONS_CONTEXT_OTHER">
            </ng-container>
        </div>
    </div>

    <div id="commands">
        <div class="button" appClickStopPropagation [attr.disabled]="commandsEnabled ? null : true"
             (click)="!commandsEnabled || onCommandRestart()">
            <img src="assets/icons/refresh.svg" />
            <span class="text">Restart</span>
        </div>
    </div>
</div>
