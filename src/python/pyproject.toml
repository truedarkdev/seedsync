[tool]
[tool.poetry]
name = "seedsync"
version = "0.0.0"
description = ""
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
bottle = ">=0.12.25,<0.13"
mkdocs = "*"
mkdocs-material = "*"
parameterized = "*"
patool = "*"
pexpect = "*"
pytz = "*"
tblib = "*"
six = "^1.17.0"

[tool.poetry.group.dev.dependencies]
pyinstaller = ">=6.11,<7"
testfixtures = "*"
webtest = "*"
pytest = "^7.4.4"
pytest-timeout = "^2.3.1"
pytest-cov = "^4.1"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
]
ignore = [
    "E501",  # line too long - keep the baseline conservative for now
    "E721",  # type comparison - legacy patterns intentionally use type()
    "E722",  # bare except - existing fallback paths still rely on it
    "E741",  # ambiguous variable name - a few single-letter locals are intentional
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.pytest.ini_options]
pythonpath = ["."]
timeout = 60
cache_dir = "/tmp/.pytest_cache"
filterwarnings = [
    "ignore:'cgi' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "docs/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"
