services:
  tests:
    image: seedsync/test/angular
    container_name: seedsync_test_angular
    command:
      - npx
      - ng
      - test
      - seedsync
      - --browsers
      - ChromeHeadlessCI
      - --watch=false
    build:
      context: ../../../../
      dockerfile: src/docker/test/angular/Dockerfile
      target: seedsync_test_angular
    volumes:
      - type: bind
        source: ../../../angular
        target: /app
        read_only: true
      - type: volume
        source: angular_test_node_modules
        target: /app/node_modules
      - type: volume
        source: angular_test_cache
        target: /app/.angular

volumes:
  angular_test_node_modules:
  angular_test_cache:
