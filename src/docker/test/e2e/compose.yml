version: "3.4"
services:
  tests:
    image: seedsync/test/e2e
    container_name: seedsync_test_e2e
    build:
      context: ../../../../
      dockerfile: src/docker/test/e2e/Dockerfile
      target: seedsync_test_e2e
    depends_on:
      configure:
        condition: service_completed_successfully
      chrome:
        condition: service_healthy
      remote:
        condition: service_started
    environment:
      SEEDSYNC_E2E_API_TOKEN: ${SEEDSYNC_E2E_API_TOKEN:?SEEDSYNC_E2E_API_TOKEN is required for e2e test execution}
      SEEDSYNC_E2E_BROWSER_SESSION_SECRET: ${SEEDSYNC_E2E_BROWSER_SESSION_SECRET:?SEEDSYNC_E2E_BROWSER_SESSION_SECRET is required for remembered-session bootstrap}

  auth_seed:
    image: seedsync/test/e2e
    container_name: seedsync_test_e2e_auth_seed
    build:
      context: ../../../../
      dockerfile: src/docker/test/e2e/Dockerfile
      target: seedsync_test_e2e
    restart: "no"
    entrypoint: ["/bin/bash", "-lc"]
    environment:
      SEEDSYNC_E2E_API_TOKEN: ${SEEDSYNC_E2E_API_TOKEN:?SEEDSYNC_E2E_API_TOKEN is required for e2e auth seeding}
      SEEDSYNC_E2E_BROWSER_API_TOKEN: ${SEEDSYNC_E2E_BROWSER_API_TOKEN:?SEEDSYNC_E2E_BROWSER_API_TOKEN is required for e2e auth seeding}
      SEEDSYNC_E2E_BROWSER_SESSION_SECRET: ${SEEDSYNC_E2E_BROWSER_SESSION_SECRET:?SEEDSYNC_E2E_BROWSER_SESSION_SECRET is required for remembered-session bootstrap}
      SEEDSYNC_API_KEY_DIR: ${SEEDSYNC_API_KEY_DIR:-/config}
    volumes:
      - type: volume
        source: seedsync_test_e2e_config
        target: /config
    command: /app/auth_seed.sh

  chrome:
    image: seedsync/test/e2e/chrome
    container_name: seedsync_test_e2e_chrome
    build:
      context: ../../../../
      dockerfile: src/docker/test/e2e/chrome/Dockerfile
    shm_size: 1024M
    cap_add:
     - SYS_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status | grep -q '\"ready\": true'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  remote:
    image: seedsync/test/e2e/remote
    container_name: seedsync_test_e2e_remote
    platform: ${SEEDSYNC_PLATFORM:-linux/amd64}
    build:
      context: ../../../../
      dockerfile: src/docker/test/e2e/remote/Dockerfile

  configure:
    image: seedsync/test/e2e/configure
    container_name: seedsync_test_e2e_configure
    build:
      context: ../../../../
      dockerfile: src/docker/test/e2e/configure/Dockerfile
    depends_on:
      myapp:
        condition: service_healthy
    environment:
      SEEDSYNC_E2E_API_TOKEN: ${SEEDSYNC_E2E_API_TOKEN:?SEEDSYNC_E2E_API_TOKEN is required for e2e auth seeding}
      SEEDSYNC_API_KEY_DIR: ${SEEDSYNC_API_KEY_DIR:-/config}
    volumes:
      - type: volume
        source: seedsync_test_e2e_config
        target: /config

volumes:
  seedsync_test_e2e_config:
