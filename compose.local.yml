services:
  seedsync:
    image: seedsync-local:compose
    container_name: seedsync-local-compose
    build:
      context: .
      dockerfile: src/docker/build/docker-image/Dockerfile
      target: seedsync_run
      args:
        SCANFS_PLATFORM: "${SCANFS_PLATFORM:-linux/amd64}"
    environment:
      SEEDSYNC_DEBUG: "${SEEDSYNC_DEBUG:-0}"
      # Kept visible so the stop-trace local override can set this key explicitly.
      SEEDSYNC_STOP_RESUME_TRACE_FILE_ID: "${SEEDSYNC_STOP_RESUME_TRACE_FILE_ID:-}"
      SEEDSYNC_TARGET_ARCHIVE_TRACE_FILE_ID: "${SEEDSYNC_TARGET_ARCHIVE_TRACE_FILE_ID:-}"
      SEEDSYNC_BROWSER_HANDOVER_RECOVERY_VERSION: "${SEEDSYNC_BROWSER_HANDOVER_RECOVERY_VERSION:-}"
      SEEDSYNC_WEB_BIND_HOST: "${SEEDSYNC_WEB_BIND_HOST:-0.0.0.0}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    command:
      - /bin/bash
      - -lc
      - >
        DEBUG_FLAG="";
        set_general_option() {
          key="$$1";
          value="$$2";
          if grep -Eq "^[[:space:]]*$$key[[:space:]]*=" /config/settings.cfg; then
            sed -i -E "s|^[[:space:]]*$$key[[:space:]]*=.*$$|$$key = $$value|" /config/settings.cfg;
          else
            general_line="$$(grep -n "^\[General\][[:space:]]*$$" /config/settings.cfg | head -n 1 | cut -d: -f1)";
            if [ -n "$$general_line" ]; then
              insert_line="$$((general_line + 1))";
              sed -i "$${insert_line}i $$key = $$value" /config/settings.cfg;
            else
              printf "[General]\n%s = %s\n" "$$key" "$$value" >> /config/settings.cfg;
            fi;
          fi;
        };
        if [ "$$SEEDSYNC_DEBUG" = "1" ]; then DEBUG_FLAG="-d"; fi;
        set_general_option config_api_redact_remote_details False &&
        current_remote_python_path="$$(sed -n -E 's|^[[:space:]]*remote_python_path[[:space:]]*=[[:space:]]*||p' /config/settings.cfg | head -n 1 | tr -d '\r')";
        if [ -z "$$current_remote_python_path" ] || [ "$$current_remote_python_path" = "/usr/bin/env" ]; then
          sed -i -E "s|^[[:space:]]*remote_python_path[[:space:]]*=.*$$|remote_python_path = python3|" /config/settings.cfg;
        fi &&
        exec python /app/python/seedsync.py $$DEBUG_FLAG -c /config --html /app/html --scanfs /app/python/scan_fs.py --web-bind-host "$$SEEDSYNC_WEB_BIND_HOST"
    ports:
      - "127.0.0.1:8800:8800"
    volumes:
      - ./build/docker-local/config:/config
      - ./build/docker-local/downloads:/downloads
      - ./build/docker-local/mounts:/mounts
