
name: CI

on:
  push:
    branches: [ master ]
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:

  unittests-python:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Build package
      - name: Run Python unit tests
        run: make run-tests-python


  unittests-angular:
    name: Angular unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Build package
      - name: Run Angular unit tests
        run: make run-tests-angular


  build-deb:
    name: Build Deb
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ unittests-python, unittests-angular ]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Sets up build environment
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # moby/buildkit:master resolved to this immutable manifest on 2026-08-02.
          driver-opts: |
            image=moby/buildkit@sha256:f4fdd943a0ad01a06ec52f424b5d387c169bcb20b14c0d38f242eb0b39423d0a
            network=host
      - name: Show buildx builder instance name
        run: echo ${{ steps.buildx.outputs.name }}
      - name: Show buildx available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      # Build package
      - name: Build deb package
        run: make deb

      - name: Build scanfs artifact
        run: make scanfs

      - name: Verify deb GLIBC floor
        run: make verify-deb-glibc

      - name: Verify bundled scanfs GLIBC floor
        run: make verify-scanfs-glibc

      # Upload package
      - name: Publish artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ github.workspace }}/build/*.deb
          name: deb-${{ github.run_number }}

      # Post build steps
      - name: List built packages
        if: ${{ success() }}
        run: ls -l $GITHUB_WORKSPACE/build/

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ unittests-python, unittests-angular ]
    outputs:
      staging_image: ${{ steps.staging-image.outputs.image }}
      staging_digest: ${{ steps.staging-image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Angular dependencies
        working-directory: src/angular
        run: npm install --legacy-peer-deps

      - name: Build Angular frontend
        working-directory: src/angular
        run: npx ng build --configuration production --output-path /tmp/angular-output/build/dist

      # Sets up build environment
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # moby/buildkit:master resolved to this immutable manifest on 2026-08-02.
          driver-opts: |
            image=moby/buildkit@sha256:f4fdd943a0ad01a06ec52f424b5d387c169bcb20b14c0d38f242eb0b39423d0a
            network=host
      - name: Show buildx builder instance name
        run: echo ${{ steps.buildx.outputs.name }}
      - name: Show buildx available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      # Login using a PAT with write:packages scope
      - name: Log into GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login https://ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      # Set staging registry
      - name: Set staging registry env variable
        run: echo "staging_registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Build docker image
      - name: Build docker image
        run: |
          make docker-image \
            STAGING_REGISTRY=${{ env.staging_registry }} \
            STAGING_VERSION=${{ github.run_number }} \
            SEEDSYNC_ANGULAR_BUILD_CONTEXT=/tmp/angular-output

      - name: Record staging image digest
        id: staging-image
        run: |
          staging_image="${{ env.staging_registry }}/seedsync:${{ github.run_number }}"
          staging_digest="$(docker buildx imagetools inspect \
            "${staging_image}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [[ ! "${staging_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: Could not resolve an immutable staging image digest" >&2
            exit 1
          fi
          echo "image=${staging_image}" >> "${GITHUB_OUTPUT}"
          echo "digest=${staging_digest}" >> "${GITHUB_OUTPUT}"
          echo "Recorded tested candidate ${staging_image}@${staging_digest}"

  e2etests-deb:
    name: End-to-end tests on Deb
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEEDSYNC_E2E_API_TOKEN: seedsync-e2e-api-token
      SEEDSYNC_E2E_BROWSER_API_TOKEN: seedsync-e2e-browser-api-token
      SEEDSYNC_E2E_BROWSER_SESSION_SECRET: seedsync-e2e-browser-session-secret
    needs: [ build-deb ]
    strategy:
      matrix:
        oscode: [ ubu2004 ]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download deb package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deb-${{ github.run_number }}
          path: build/

      - name: Configure Docker cgroup namespace for systemd lane
        run: |
          echo $'{\n  "default-cgroupns-mode": "host"\n}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart
          docker info

      # Run e2e test
      - name: Run e2e test
        run: make run-tests-e2e SEEDSYNC_DEB=`readlink -f build/*.deb` SEEDSYNC_OS=${{ matrix.oscode }}

  e2etests-docker-image:
    name: End-to-end tests on Docker Image
    needs: [ build-docker-image ]
    timeout-minutes: 120
    env:
      SEEDSYNC_E2E_API_TOKEN: seedsync-e2e-api-token
      SEEDSYNC_E2E_BROWSER_API_TOKEN: seedsync-e2e-browser-api-token
      SEEDSYNC_E2E_BROWSER_SESSION_SECRET: seedsync-e2e-browser-session-secret
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: arm/v7
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Sets up build environment
      - name: Enable Docker experimental features
        run: |
          echo $'{\n    "experimental": true\n}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart
          docker version
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # moby/buildkit:master resolved to this immutable manifest on 2026-08-02.
          driver-opts: |
            image=moby/buildkit@sha256:f4fdd943a0ad01a06ec52f424b5d387c169bcb20b14c0d38f242eb0b39423d0a
            network=host
      - name: Show buildx builder instance name
        run: echo ${{ steps.buildx.outputs.name }}
      - name: Show buildx available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      # Login using a PAT with write:packages scope
      - name: Log into GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login https://ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      # Set staging registry
      - name: Set staging registry env variable
        run: echo "staging_registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - name: Resolve E2E platform
        run: echo "SEEDSYNC_PLATFORM=$(src/docker/test/resolve_platform.sh '${{ matrix.arch }}')" >> $GITHUB_ENV

      # Run e2e test
      - name: Run e2e test
        run: make run-tests-e2e \
          STAGING_REGISTRY=${{ env.staging_registry }} \
          STAGING_VERSION=${{ github.run_number }} \
          SEEDSYNC_ARCH=${{ matrix.arch }} \
          SEEDSYNC_PLATFORM=${{ env.SEEDSYNC_PLATFORM }}

  publish-docker-image:
    name: Publish Docker Image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ build-docker-image, e2etests-deb, e2etests-docker-image ]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set release env variable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Release tag must be v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "${GITHUB_ENV}"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Sets up build environment
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # moby/buildkit:master resolved to this immutable manifest on 2026-08-02.
          driver-opts: |
            image=moby/buildkit@sha256:f4fdd943a0ad01a06ec52f424b5d387c169bcb20b14c0d38f242eb0b39423d0a
            network=host
      - name: Show buildx builder instance name
        run: echo ${{ steps.buildx.outputs.name }}
      - name: Show buildx available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      # Login to GHCR using a PAT with write:packages scope
      - name: Log into GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login https://ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      # Login to Dockerhub
      - name: Log into Dockerhub registry
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: printf '%s' "${DOCKERHUB_TOKEN}" |
          docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
      # Set staging registry
      - name: Set staging registry env variable
        run: echo "staging_registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Promote the exact multi-architecture image that passed E2E.
      - name: Promote tested image to Dockerhub
        env:
          TESTED_STAGING_DIGEST: ${{ needs.build-docker-image.outputs.staging_digest }}
        run: make docker-image-release \
          STAGING_REGISTRY="${{ env.staging_registry }}" \
          STAGING_VERSION="${{ github.run_number }}" \
          STAGING_DIGEST="${TESTED_STAGING_DIGEST}" \
          RELEASE_REGISTRY="docker.io/truedarkdev" \
          RELEASE_VERSION="${RELEASE_VERSION}"

  # Deb packages remain build- and e2e-tested, but are not published until the
  # direct/deb upgrade path has its own certification evidence.
